[project]
name = "clipmaker"
version = "0.1.0"
description = "Turn long YouTube videos into short clips with burned-in animated subtitles."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp>=2025.1.1",
    "mlx-whisper>=0.4.2",
    "openai>=1.99",
    "pydantic>=2.6",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "imageio-ffmpeg>=0.5.1",
    "fastapi>=0.142.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "fonttools>=4.66.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[project.scripts]
clipmaker = "clipmaker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
